    stability: experimental
    depends_on: [ExtensionTk::dynload, InteropTk::ctypes, InteropTk::layout, InteropTk::callconv, FFItk::cif]
    provides:
      types: [exl_context_t, exl_library_t, exl_kind_t, exl_value_t, exl_signature_t, exl_native_fn, exl_native_address_t, exl_callconv_t, exl_extension_symbol_t, exl_extension_descriptor_t, exl_native_type_t, exl_native_kind_t, exl_data_signature_t, exl_data_argument_t]
